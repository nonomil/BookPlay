<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伙伴与收藏 · 豆豆龙英语</title>
  <link rel="stylesheet" href="style.css?v=png1">
  <link rel="stylesheet" href="collection-assets-preview.css?v=1">
  <link rel="stylesheet" href="tv.css?v=1">
</head>
<body class="collection-preview-body">
  <main class="collection-preview-app">
    <header class="collection-preview-head">
      <a class="w-nav-btn" id="back-link" href="home.html">← 返回书架</a>
      <div>
        <p class="collection-kicker">STORY COMPANIONS · 故事收藏</p>
        <h1 id="series-title">伙伴与收藏</h1>
        <p id="series-subtitle">角色动作、故事贴纸、勋章和房间道具</p>
      </div>
    </header>
    <p id="status" class="collection-status" role="status">正在读取收藏目录…</p>
    <section class="collection-section" aria-labelledby="characters-title">
      <div class="section-heading"><div><span class="collection-kicker">CHARACTERS · 主角动作</span><h2 id="characters-title">伙伴登场</h2></div><span class="section-note">完成卡和收藏页使用</span></div>
      <div id="characters" class="character-grid"></div>
    </section>
    <section class="collection-section" aria-labelledby="stickers-title">
      <div class="section-heading"><div><span class="collection-kicker">STICKERS · 故事贴纸</span><h2 id="stickers-title">每本书带走一件故事纪念</h2></div><span class="section-note">贴纸册</span></div>
      <div id="stickers" class="asset-grid"></div>
    </section>
    <section class="collection-section" aria-labelledby="badges-title">
      <div class="section-heading"><div><span class="collection-kicker">BADGES · 勋章</span><h2 id="badges-title">里程碑勋章</h2></div><span class="section-note">完成后点亮</span></div>
      <div id="badges" class="asset-grid"></div>
    </section>
    <section class="collection-section" aria-labelledby="items-title">
      <div class="section-heading"><div><span class="collection-kicker">ROOM ITEMS · 房间道具</span><h2 id="items-title">把冒险放进房间</h2></div><span class="section-note">非数值奖励</span></div>
      <div id="items" class="asset-grid"></div>
    </section>
  </main>
  <script src="tv-remote.js?v=1"></script>
  <script src="collection-assets-preview.js?v=1"></script>
</body>
</html>
