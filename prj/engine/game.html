<!doctype html>
<html lang="zh-CN">
<head>
  <script src="./native-key.js"></script>
  <script defer src="./handheld-controls.js" data-app="bookplay"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>降妖记·大地图 | 豆豆龙英语</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tv.css?v=game-1">
  <link rel="stylesheet" href="handheld.css?v=4">
  <link rel="stylesheet" href="app-audio.css?v=1">
  <link rel="stylesheet" href="battle.css?v=battle-3">
  <link rel="stylesheet" href="game.css?v=game-10">
</head>
<body data-audio-scene="jttw" data-audio-volume="0.30">
  <main class="game" id="game-root">
    <section class="game-scene" id="game-scene" aria-label="探索大地图">
      <div class="game-world" id="game-world">
        <div class="game-backdrop" id="game-backdrop" aria-hidden="true"></div>
        <div class="game-entities" id="game-entities"></div>
        <div class="game-projectiles" id="game-projectiles" aria-hidden="true"></div>
        <div class="game-particles" id="game-particles" aria-hidden="true"></div>
      </div>
    </section>

    <header class="game-hud">
      <div class="game-pill" aria-label="星星">⭐ <strong id="game-stars">0</strong></div>
      <div class="game-pill" aria-label="进度">⚔ <strong id="game-progress">0 / 0</strong></div>
      <div class="game-pill" aria-label="护盾"><span id="game-shields">🛡️🛡️🛡️</span></div>
      <div class="game-pill game-carried" aria-label="当前中文球">🎐 <strong id="game-carried">空手</strong></div>
      <div class="game-pill game-combo" aria-label="连击">连击 <strong id="game-combo">0</strong></div>
      <span data-audio-slot></span>
      <button type="button" class="game-hudbtn" id="game-hint" aria-label="单词提示" tabindex="0">💡 提示</button>
      <button type="button" class="game-hudbtn" id="game-exit" aria-label="暂停" tabindex="0">⏸ 暂停</button>
    </header>

    <section class="game-banner" id="game-banner" hidden aria-live="polite">
      <span class="game-banner-kicker" id="game-banner-kicker">进入新区域</span>
      <strong id="game-banner-title">花果山</strong>
    </section>

    <nav class="game-route" id="game-route" aria-label="本集三站">
      <button type="button" class="game-route-node" data-stop="wave1" tabindex="0">
        <strong>小妖</strong><small>第 01 站</small>
      </button>
      <button type="button" class="game-route-node" data-stop="npc" tabindex="0">
        <strong>问答</strong><small>第 02 站</small>
      </button>
      <button type="button" class="game-route-node" data-stop="boss" tabindex="0">
        <strong>大战</strong><small>第 03 站</small>
      </button>
    </nav>
    <aside class="game-supports" id="game-supports" aria-label="支援道具"></aside>
    <aside class="game-hintcard" id="game-hintcard" hidden aria-live="polite"></aside>
    <nav class="game-typepad" id="game-typepad" hidden aria-label="跟打键盘"></nav>

    <div class="game-joystick" id="game-joystick" aria-hidden="true"><div class="game-stick" id="game-stick"></div></div>
    <div class="game-dpad-hint" id="game-dpad-hint" aria-hidden="true">方向键移动 · 走过词球捡起 · 点小妖投掷</div>

    <section class="game-dialogue" id="game-dialogue" hidden aria-live="polite">
      <img class="game-dialogue-face" id="game-dialogue-face" alt="" decoding="async">
      <div class="game-dialogue-body">
        <span class="game-dialogue-kicker" id="game-dialogue-kicker">剧情</span>
        <span class="game-dialogue-name" id="game-dialogue-name">NPC</span>
        <p class="game-dialogue-en" id="game-dialogue-en"></p>
        <p class="game-dialogue-zh" id="game-dialogue-zh"></p>
        <div class="game-dialogue-choices" id="game-dialogue-choices"></div>
        <button type="button" class="battle-secondary game-dialogue-replay" id="game-dialogue-replay" tabindex="0">🔊 重听</button>
        <button type="button" class="game-primary" id="game-dialogue-next" tabindex="0">继续 ▼</button>
        <button type="button" class="battle-secondary game-dialogue-close" id="game-dialogue-close" tabindex="0" aria-label="关闭对话">关闭</button>
      </div>
    </section>

    <section class="game-panel game-bossgate" id="game-bossgate" hidden aria-live="polite"></section>
    <section class="game-panel game-pause" id="game-pause" hidden aria-label="暂停">
      <h2 class="battle-panel-title">休息一下</h2>
      <button type="button" class="game-primary" id="game-resume" tabindex="0">继续冒险</button>
      <button type="button" class="battle-secondary" id="game-restart" tabindex="0">重玩本集</button>
      <button type="button" class="battle-secondary" data-open-handheld tabindex="0">掌机按键</button>
      <button type="button" class="battle-secondary" id="game-map" tabindex="0">回地图</button>
    </section>
    <section class="game-panel game-gate" id="game-gate" hidden aria-live="polite"></section>
    <div class="battle-toast" id="game-toast" hidden aria-live="polite"></div>
  </main>

  <script src="app-audio.js?v=2"></script>
  <script src="content-gate.js?v=2"></script>
  <script src="tv-remote.js?v=game-1"></script>
  <script src="game-common.js?v=1"></script>
  <script src="battle-core.js?v=battle-4"></script>
  <script src="game-core.js?v=game-17"></script>
  <script src="game-input.js?v=game-1"></script>
  <script src="game-audio.js?v=game-1"></script>
  <script src="collection-core.js?v=dex-1"></script>
  <script src="schedule-core.js?v=farm-1"></script>
  <script src="economy-core.js?v=farm-1"></script>
  <script src="farm-core.js?v=farm-1"></script>
  <script src="farm-ui.js?v=farm-6-nofarm"></script>
  <script src="game.js?v=game-27"></script>
  <script src="game-feedback.js?v=fx-1"></script>
</body>
</html>
