<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>豆豆龙英语 · 巩固提高</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="drill.css?v=7">
  <link rel="stylesheet" href="tv.css?v=1">
  <link rel="stylesheet" href="app-audio.css?v=1">
  <script src="app-audio.js?v=2"></script>
</head>
<body class="drill-body">
  <div id="d-top">
    <a id="btn-back" href="map.html">← 返回地图</a>
    <h1 id="d-title">巩固</h1>
    <span data-audio-slot></span>
    <span id="d-sp">★ 0</span>
  </div>

  <nav id="d-tabs">
    <button class="tab" data-tab="review" type="button">知识回顾</button>
    <button class="tab active" data-tab="words" type="button">单词 <span id="t-words">0/0</span></button>
    <button class="tab" data-tab="puzzles" type="button">句型 <span id="t-puzzles">0/0</span></button>
    <button class="tab" data-tab="quiz" type="button">测验 <span id="t-quiz">0/0</span></button>
    <button class="tab" data-tab="wrong" type="button">错题回顾 <span id="t-wrong">0</span></button>
  </nav>

  <main id="d-main">
    <div id="d-error" class="panel hidden">
      <h2>参数错误</h2>
      <p>没有找到这个巩固单元。</p>
      <a class="w-btn-gold" href="map.html">← 回地图</a>
    </div>
    <div id="d-review" class="panel hidden">
      <div class="q-progress">本辑重点词 · 点击英文可听发音</div>
      <div id="review-grid" class="review-grid"></div>
      <div class="review-actions">
        <button id="review-continue" class="btn-gold review-continue" type="button" disabled>继续 (4)</button>
      </div>
    </div>
    <div id="d-words" class="panel">
      <div class="q-progress">单词补全 <span id="w-progress">0/0</span></div>
      <div class="relearn-row">
        <button id="w-relearn" type="button" class="relearn-btn" aria-label="再学一次当前单词">
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.4L21 15m0 0v5m0-5h-5"/>
          </svg>
          <span>再学一次</span>
        </button>
      </div>
      <div id="w-card"></div>
    </div>
    <div id="d-puzzles" class="panel hidden">
      <div class="q-progress">句型排序 <span id="p-progress">0/0</span></div>
      <div id="p-card"></div>
    </div>
    <div id="d-quiz" class="panel hidden">
      <div class="q-progress">剧情测验 <span id="q-progress">0/0</span></div>
      <div id="q-card"></div>
    </div>
    <div id="d-wrong" class="panel hidden">
      <div class="q-progress">错题回顾 <span id="wrong-progress">0/0</span></div>
      <div id="wrong-card"></div>
    </div>
    <div id="d-finish" class="panel hidden"></div>
  </main>

  <div id="d-toast" class="hidden"></div>

  <script src="tv-remote.js?v=1"></script>
 <script src="media.js?v=1"></script>
 <script src="voice-core.js?v=1"></script>
 <script src="voice.js?v=1"></script>
  <script src="episode-vocab-quiz.js?v=2"></script>
 <script src="drill.js?v=12"></script>
</body>
</html>
