<!doctype html>
<html lang="zh-CN">
<head>
  <script src="./native-key.js"></script>
  <script defer src="./handheld-controls.js" data-app="bookplay"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>降妖记 | 豆豆龙英语</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tv.css?v=battle-1">
  <link rel="stylesheet" href="handheld.css?v=4">
  <link rel="stylesheet" href="battle.css?v=battle-7">
  <link rel="stylesheet" href="app-audio.css?v=2">
  <script src="app-audio.js?v=3"></script>
</head>
<body data-audio-scene="jttw">
  <main class="battle" id="battle-root">
    <section class="battle-scene" aria-label="战斗场景">
      <div class="battle-backdrop" id="battle-backdrop" aria-hidden="true"></div>
      <div class="battle-arena" id="battle-arena" aria-hidden="true">
        <div class="battle-arena-glow"></div>
        <div class="battle-arena-floor" id="battle-arena-floor"></div>
        <div class="battle-arena-shadow is-hero"></div>
        <div class="battle-arena-shadow is-boss"></div>
      </div>
      <div class="battle-hero" id="battle-hero" aria-hidden="true"></div>
      <div class="battle-monsters" id="battle-monsters"></div>
      <div class="battle-projectiles" id="battle-projectiles" aria-hidden="true"></div>
    </section>

    <header class="battle-hud">
      <div class="battle-progress" id="battle-progress" aria-label="进度">0 / 0</div>
      <div class="battle-combo" id="battle-combo" aria-label="连击">连击 0</div>
      <button type="button" class="battle-defend" id="battle-defend" hidden>护体</button>
      <button type="button" class="battle-exit" id="battle-exit" aria-label="暂停">∥</button>
    </header>

    <section class="battle-prompt" id="battle-prompt" hidden>
      <p class="battle-prompt-kicker" id="battle-prompt-kicker">答对就出招</p>
      <h2 class="battle-prompt-main" id="battle-prompt-main"></h2>
      <p class="battle-prompt-sub" id="battle-prompt-sub"></p>
      <div class="battle-race" id="battle-race" hidden aria-label="抢答倒计时">
        <span class="battle-race-fill" id="battle-race-fill"></span>
      </div>
      <button type="button" class="battle-listen" id="battle-listen" hidden>🔊 再听一遍</button>
      <button type="button" class="battle-skip" id="battle-skip" hidden>不会</button>
    </section>
    <p class="battle-turn" id="battle-turn" hidden>悟空回合</p>

    <section class="battle-hp-dock" id="battle-hp-dock" hidden>
      <div class="battle-hp-side is-hero">
        <strong id="battle-hero-hp-name">孙悟空</strong>
        <div class="battle-hero-hp" id="battle-hero-hp">
          <span class="battle-hero-hp-fill" id="battle-hero-hp-fill"></span>
        </div>
        <div class="battle-shields" id="battle-shields" aria-label="护盾">🛡️🛡️🛡️</div>
      </div>
      <p class="battle-skill-banner" id="battle-skill-banner" hidden></p>
      <div class="battle-hp-side is-boss"></div>
    </section>

    <section class="battle-bossbar" id="battle-bossbar" hidden>
      <strong id="battle-boss-name">Boss</strong>
      <div class="battle-boss-hp" id="battle-boss-hp">
        <span class="battle-boss-hp-fill" id="battle-boss-hp-fill"></span>
      </div>
    </section>
    <ol class="battle-log" id="battle-log" hidden aria-live="polite"></ol>

    <section class="battle-dialogue" id="battle-dialogue" hidden aria-live="polite">
      <img class="battle-dialogue-face" id="battle-dialogue-face" alt="" decoding="async">
      <p class="battle-dialogue-en" id="battle-dialogue-en"></p>
      <p class="battle-dialogue-zh" id="battle-dialogue-zh"></p>
      <button type="button" class="battle-secondary battle-dialogue-replay" id="battle-dialogue-replay" tabindex="0">🔊 重听</button>
      <button type="button" class="battle-primary" id="battle-dialogue-next" tabindex="0">继续 ▶</button>
    </section>

    <section class="battle-preview" id="battle-preview" hidden aria-label="战前预习">
      <h2 class="battle-panel-title">战前预习 · 记住这些词</h2>
      <div class="battle-preview-cards" id="battle-preview-cards"></div>
      <button type="button" class="battle-primary" id="battle-preview-start" tabindex="0">开打！⚔️</button>
    </section>

    <section class="battle-panel battle-task" id="battle-task" hidden aria-live="polite">
      <p class="battle-task-kicker" id="battle-task-kicker">降妖记</p>
      <h2 class="battle-panel-title" id="battle-task-title">先办这一件事</h2>
      <p id="battle-task-body"></p>
      <button type="button" class="battle-primary" id="battle-task-go" tabindex="0">去降妖</button>
    </section>

    <section class="battle-orbs" id="battle-orbs" aria-label="选词"></section>

    <section class="battle-quiz" id="battle-quiz" hidden aria-label="关底测验"></section>

    <section class="battle-result" id="battle-result" hidden aria-live="polite"></section>

    <section class="battle-panel battle-pause" id="battle-pause" hidden aria-label="暂停">
      <h2 class="battle-panel-title">休息一下</h2>
      <span data-audio-slot></span>
      <span data-audio-settings-slot></span>
      <button type="button" class="battle-primary" id="battle-resume" tabindex="0">继续战斗</button>
      <button type="button" class="battle-secondary" id="battle-restart" tabindex="0">重玩本集</button>
      <button type="button" class="battle-secondary" data-open-handheld tabindex="0">掌机按键</button>
      <button type="button" class="battle-secondary" id="battle-map" tabindex="0">回地图</button>
    </section>

    <section class="battle-panel battle-gate" id="battle-gate" hidden aria-live="polite"></section>

    <div class="battle-toast" id="battle-toast" hidden aria-live="polite"></div>
  </main>

  <script src="content-gate.js?v=2"></script>
  <script src="tv-remote.js?v=battle-1"></script>
  <script src="game-common.js?v=1"></script>
  <script src="episode-vocab-quiz.js?v=battle-1"></script>
  <script src="battle-core.js?v=battle-10"></script>
  <script src="game-core.js?v=game-9"></script>
  <script src="game-audio.js?v=game-1"></script>
  <script src="collection-core.js?v=dex-1"></script>
  <script src="battle.js?v=battle-10"></script>
</body>
</html>
