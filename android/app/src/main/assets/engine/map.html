<!DOCTYPE html>
<html lang="zh">
<head>
  <script src="./native-key.js"></script>
  <script defer src="./handheld-controls.js" data-app="bookplay"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>豆豆龙英语 · 绘本路线图</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="map.css?v=68">
  <link rel="stylesheet" href="tv.css?v=1">
  <link rel="stylesheet" href="handheld.css?v=2">
  <link rel="stylesheet" href="app-audio.css?v=2">
  <script src="app-audio.js?v=3"></script>
</head>
<body data-audio-scene="series" data-audio-volume="0.30" data-audio-duck-volume="0.08" class="map-body">
  <div id="map-splash">
    <div id="splash-txt">
      <h1 id="splash-title">绘本路线图</h1>
      <p id="splash-sub">Storybook Route</p>
      <span id="splash-tip">点击任意处进入</span>
    </div>
    <a id="splash-companion" hidden href="companion.html?series=jttw" aria-label="进入白龙马驿站">
      <span class="splash-companion-icon" aria-hidden="true">🥚</span>
      <span class="splash-companion-copy">
        <b id="splash-companion-name">神秘龙蛋</b>
        <small id="splash-companion-progress">🏅 0 / 19</small>
        <span id="splash-companion-medals" class="splash-companion-medals" aria-label="最近获得的勋章">
          <span class="splash-medals-label">最近勋章</span>
          <span id="splash-medal-strip" class="splash-medal-strip" aria-live="polite"></span>
              <span id="splash-medal-empty" class="splash-medal-empty">完成一本故事，点亮第一枚</span>
        </span>
        <em>进入白龙马驿站 →</em>
      </span>
    </a>
  </div>
  <div id="map-tools">
    <details class="app-settings" id="map-settings">
      <summary>设置</summary>
      <div class="app-settings-panel">
        <button type="button" data-open-handheld>掌机按键</button>
      </div>
    </details>
    <div id="map-audio-float" aria-label="背景音乐"><span data-audio-slot></span></div>
  </div>
  <a id="map-dex-float" href="dex.html?series=jttw" aria-label="打开妖怪图鉴" title="妖怪图鉴">📖 图鉴</a>
  <nav id="map-worlds" hidden aria-label="合辑世界"></nav>
  <div id="map-track"></div>
  <div id="map-hint">← 左右滑动切换合辑 →</div>
  <button id="nav-prev" type="button" aria-label="上一个合辑">‹</button>
  <button id="nav-next" type="button" aria-label="下一个合辑">›</button>
  <div id="map-toast" class="hidden"></div>
  <script src="tv-remote.js?v=1"></script>
  <script src="content-gate.js?v=1"></script>
  <script src="companion-core.js?v=1"></script>
  <script src="map.js?v=68"></script>
</body>
</html>
