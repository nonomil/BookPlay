<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="./native-key.js"></script>
  <script defer src="./handheld-controls.js" data-app="bookplay"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>看图复述 · BookPlay 书戏</title>
  <link rel="stylesheet" href="tv.css?v=2">
  <link rel="stylesheet" href="handheld.css?v=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #101732 0%, #1a2342 100%);
      color: #eef2ff;
      font: 15px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: max(14px, env(safe-area-inset-top)) 14px 40px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .back {
      min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px;
      border-radius: 12px; border: 1px solid rgba(255, 215, 106, 0.5);
      background: rgba(255, 215, 106, 0.14); color: #ffd76a;
      font-weight: 700; text-decoration: none; cursor: pointer;
    }
    h1 { font-size: 20px; letter-spacing: 1px; }
    .sub { color: #93a0c4; font-size: 12px; margin-bottom: 16px; }
    .stage-tip {
      text-align: center; margin: 0 auto 14px; padding: 6px 16px;
      display: table; border-radius: 999px;
      border: 1px dashed rgba(255, 215, 106, 0.45); color: #ffd76a; font-size: 14px;
    }
    /* 排序：图池 + 槽位 */
    .pool { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 18px; }
    .pic {
      width: min(180px, 40vw); border-radius: 14px; overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.25); cursor: pointer;
      background: none; padding: 0;
    }
    .pic img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .pic:hover, .pic:focus-visible { border-color: #ffd76a; outline: none; }
    .slots { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 18px; }
    .slot {
      width: min(180px, 40vw); min-height: 110px; border-radius: 14px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; padding: 0; overflow: hidden; cursor: default; background: rgba(255,255,255,0.04);
      position: relative;
    }
    .slot .slot-label { color: #93a0c4; font-size: 13px; }
    .slot.filled { border-style: solid; border-color: rgba(125, 206, 160, 0.6); cursor: pointer; }
    .slot.filled img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .slot.filled .slot-label { position: absolute; left: 6px; top: 6px; background: rgba(10,14,28,0.75); padding: 1px 8px; border-radius: 999px; }
    .slot.wrong { border-color: #e07474; }
    .slot.right { border-color: #7dcea0; }
    /* 录音 */
    .tell { display: grid; gap: 14px; justify-items: center; }
    .tell .pic.solo { width: min(420px, 84vw); cursor: default; }
    .tell-en { font-size: 17px; font-weight: 700; text-align: center; }
    .tell-zh { color: #93a0c4; text-align: center; font-size: 14px; }
    .rec-btn {
      min-height: 68px; min-width: 220px; border: none; border-radius: 16px;
      background: linear-gradient(180deg, #ffd76a, #e8b64c); color: #3a2a08;
      font: 700 17px/1 "PingFang SC", "Microsoft YaHei", sans-serif; cursor: pointer;
    }
    .rec-btn.recording { background: linear-gradient(180deg, #ff8f7a, #e05c48); color: #fff; }
    .hint-btn {
      min-height: 44px; padding: 0 18px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); color: #eef2ff;
    }
    .progress-dots { display: flex; gap: 8px; justify-content: center; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .dot.done { background: #7dcea0; }
    .dot.now { background: #ffd76a; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .primary, .ghost {
      min-height: 60px; padding: 0 26px; border-radius: 14px; cursor: pointer;
      font: 700 16px/1.2 "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .primary { border: none; background: linear-gradient(180deg, #ffd76a, #e8b64c); color: #3a2a08; }
    .ghost { border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); color: #eef2ff; }
    .encourage { text-align: center; color: #a9e5c4; min-height: 24px; font-size: 14px; }
    .finish { text-align: center; display: grid; gap: 12px; justify-items: center; }
    .finish h2 { color: #ffd76a; font-size: 22px; }
    .empty { text-align: center; color: #93a0c4; padding: 40px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="map.html">← 返回地图</a>
      <h1 id="retell-title">看图复述</h1>
    </header>
    <p class="sub">用自己的话把故事讲出来 · 数据只保存在这台设备上</p>

    <div id="retell-unavailable" class="empty hidden">这一集还没有可复述的图画。</div>

    <section id="stage-order" class="hidden">
      <p class="stage-tip">第一步：把图画按故事顺序排一排（点图放进槽位）</p>
      <div class="pool" id="order-pool"></div>
      <div class="slots" id="order-slots"></div>
      <div class="actions">
        <button id="order-check" class="primary" type="button">检查顺序</button>
      </div>
      <p class="encourage" id="order-feedback" role="status" aria-live="polite"></p>
    </section>

    <section id="stage-tell" class="hidden">
      <p class="stage-tip">第二步：看图说话，一图一句</p>
      <div class="tell">
        <button id="tell-pic" class="pic solo" type="button"><img id="tell-img" alt="场景图"></button>
        <p class="tell-en" id="tell-en"></p>
        <p class="tell-zh" id="tell-zh"></p>
        <button id="tell-hint" class="hint-btn hidden" type="button">🔊 听提示</button>
        <button id="tell-rec" class="rec-btn" type="button">🎙 按下开始说</button>
        <div class="progress-dots" id="tell-dots"></div>
        <p class="encourage" id="tell-feedback" role="status" aria-live="polite"></p>
        <div class="actions">
          <button id="tell-prev" class="ghost hidden" type="button">上一张</button>
          <button id="tell-finish" class="primary hidden" type="button">讲完啦，去放映</button>
        </div>
      </div>
    </section>

    <section id="stage-show" class="hidden">
      <p class="stage-tip">放映时间：听自己的故事</p>
      <div class="tell">
        <button id="show-pic" class="pic solo" type="button"><img id="show-img" alt="场景图"></button>
        <button id="show-play" class="primary" type="button">▶ 播我的复述</button>
        <div class="progress-dots" id="show-dots"></div>
      </div>
      <div class="finish" id="retell-finish"></div>
    </section>
  </div>
  <script src="tv-remote.js?v=1"></script>
  <script src="storage.js?v=2"></script>
  <script src="step-log-core.js?v=1"></script>
  <script src="step-log.js?v=1"></script>
  <script src="dub-store.js?v=1"></script>
  <script src="dub-recorder.js?v=1"></script>
  <script src="retell-core.js?v=1"></script>
  <script src="retell.js?v=1"></script>
</body>
</html>
