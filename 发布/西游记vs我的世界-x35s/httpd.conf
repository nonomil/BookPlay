# busybox httpd：给 Servo 正确的 ESM MIME。默认没有 .html/.mjs，页面空白带鼠标。
A:*
.html:text/html
.css:text/css
.js:application/javascript
.mjs:text/javascript
.json:application/json
.png:image/png
.jpg:image/jpeg
.jpeg:image/jpeg
.webp:image/webp
.gif:image/gif
.svg:image/svg+xml
.ogg:audio/ogg
.mp3:audio/mpeg
.wav:audio/wav
.wasm:application/wasm
.ttf:font/ttf
.woff:font/woff
.woff2:font/woff2
